<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <style>
    .headline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .subtext { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 700; }
  </style>

  <rect width="860" height="440" rx="16" fill="url(#bg3)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Diagram Title -->
  <text x="40" y="44" class="headline">The Twin-Engine Stress Test (Bit-Level Equivalence)</text>
  <text x="40" y="64" class="subtext">How Code Archeologist proves 40-year-old COBOL and modern Rust/Wasm make the exact same calculations.</text>

  <!-- Left: 1982 Vintage Engine -->
  <g transform="translate(40, 95)">
    <rect width="240" height="270" rx="12" fill="#17140f" stroke="#78350f" stroke-width="1.5"/>
    <rect x="14" y="14" width="120" height="20" rx="4" fill="#d97706" opacity="0.2"/>
    <text x="22" y="28" class="badge" fill="#fbbf24">1982 VINTAGE ENGINE</text>

    <text x="14" y="65" class="mono" fill="#fde68a">Legacy C89 / COBOL</text>
    <text x="14" y="85" class="subtext">Unmaintained, dying hardware</text>

    <!-- Vintage CRT screen graphic -->
    <rect x="14" y="110" width="212" height="100" rx="8" fill="#0c180e" stroke="#15803d"/>
    <text x="24" y="135" class="mono" fill="#4ade80">&gt; RUN REBATE.EXE</text>
    <text x="24" y="155" class="mono" fill="#4ade80">&gt; 16-BIT REGISTER: OK</text>
    <text x="24" y="175" class="mono" fill="#4ade80">&gt; RETURN: 49598</text>
    <text x="24" y="195" class="badge" fill="#86efac">WRAPPED AT 65535</text>

    <text x="14" y="245" class="mono" fill="#d97706">Has memory leak CVEs</text>
  </g>

  <!-- Center: Fuzzer Inserter -->
  <g transform="translate(310, 140)">
    <rect width="240" height="180" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="14" y="14" width="120" height="20" rx="4" fill="#6366f1" opacity="0.2"/>
    <text x="22" y="28" class="badge" fill="#a5b4fc">MUTATION FUZZER</text>

    <text x="14" y="60" class="subtext">Throws 100,000 edge-case payloads simultaneously into both engines:</text>

    <rect x="14" y="90" width="212" height="40" rx="6" fill="#1e1b4b"/>
    <text x="22" y="115" class="mono" fill="#c7d2fe">b'\xff\xff\x00\x00\x74\x65'</text>

    <text x="14" y="150" class="mono" fill="#a5b4fc">Did both outputs match?</text>
  </g>

  <!-- Right: Modern 2026 WASM Engine -->
  <g transform="translate(580, 95)">
    <rect width="240" height="270" rx="12" fill="#081826" stroke="#0284c7" stroke-width="2"/>
    <rect x="14" y="14" width="125" height="20" rx="4" fill="#0284c7" opacity="0.2"/>
    <text x="22" y="28" class="badge" fill="#38bdf8">2026 WASM MICROVM</text>

    <text x="14" y="65" class="mono" fill="#bae6fd">Memory-Safe Rust</text>
    <text x="14" y="85" class="subtext">Zero buffer overflow risk</text>

    <!-- Modern chip graphic -->
    <rect x="14" y="110" width="212" height="100" rx="8" fill="#0c1f2e" stroke="#0284c7"/>
    <text x="24" y="135" class="mono" fill="#38bdf8">&gt; wasm32-wasi sandbox</text>
    <text x="24" y="155" class="mono" fill="#38bdf8">&gt; Emulated 16-bit wrap</text>
    <text x="24" y="175" class="mono" fill="#34d399">&gt; RETURN: 49598</text>
    <text x="24" y="195" class="badge" fill="#34d399">EXACT MATCH (100% BIT PARITY)</text>

    <text x="14" y="245" class="mono" fill="#38bdf8">Runs in any cloud container</text>
  </g>

  <!-- Bottom strip -->
  <rect x="40" y="390" width="780" height="34" rx="6" fill="#030712" stroke="#1f2937"/>
  <circle cx="58" cy="407" r="4" fill="#38bdf8"/>
  <text x="74" y="411" class="mono" fill="#94a3b8">Modernize legacy codebases without breaking obscure arithmetic quirks your business depends on.</text>
</svg>
