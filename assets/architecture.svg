<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #f8fafc; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
    .tag { font-size: 10px; font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>

  <rect width="860" height="420" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Window controls -->
  <circle cx="36" cy="36" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="54" cy="36" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="72" cy="36" r="6" fill="#10b981" opacity="0.8"/>
  <text x="100" y="41" class="mono" fill="#64748b">code-archeologist // Legacy Decompilation &amp; Differential Wasm Fuzzer</text>

  <!-- Left: Legacy Artifact -->
  <g transform="translate(40, 80)">
    <rect width="220" height="110" rx="8" fill="#1e1814" stroke="#78350f"/>
    <rect x="12" y="12" width="105" height="18" rx="4" fill="#d97706" opacity="0.2"/>
    <text x="18" y="25" class="tag" fill="#fbbf24">LEGACY TARGET</text>
    <text x="14" y="54" class="title">COBOL / Fortran / C89</text>
    <text x="14" y="74" class="mono" fill="#fcd34d">Architecture: x86-16 / M68k</text>
    <text x="14" y="92" class="mono" fill="#b45309">16-bit unsigned wrap math</text>
  </g>

  <!-- Middle: Decompiler Arrow -->
  <path d="M 260 135 L 320 135" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <text x="270" y="125" class="mono" fill="#d97706">AST Map</text>

  <!-- Modern Target -->
  <g transform="translate(320, 80)">
    <rect width="220" height="110" rx="8" fill="#0f1f2e" stroke="#0284c7"/>
    <rect x="12" y="12" width="115" height="18" rx="4" fill="#0284c7" opacity="0.2"/>
    <text x="18" y="25" class="tag" fill="#38bdf8">WASM SANDBOX</text>
    <text x="14" y="54" class="title">Memory-Safe Rust</text>
    <text x="14" y="74" class="mono" fill="#7dd3fc">Target: wasm32-wasi</text>
    <text x="14" y="92" class="mono" fill="#38bdf8">Bounded linear memory</text>
  </g>

  <!-- Dual Execution Fuzzer (Bottom) -->
  <g transform="translate(40, 220)">
    <rect width="780" height="150" rx="10" fill="#0c1322" stroke="#1e293b"/>

    <rect x="16" y="16" width="150" height="20" rx="4" fill="#6366f1" opacity="0.2"/>
    <text x="24" y="30" class="tag" fill="#818cf8">DIFFERENTIAL MUTATOR</text>

    <!-- Fuzzing mutation stream -->
    <text x="20" y="65" class="mono" fill="#94a3b8">Seed: b'test' -&gt; Mutations: [Bit-Flip, \xff\xff Boundary, Arithmetic Wrap]</text>

    <!-- Twin outputs -->
    <g transform="translate(20, 85)">
      <rect width="350" height="42" rx="6" fill="#181313" stroke="#7f1d1d"/>
      <text x="10" y="18" class="mono" fill="#fca5a5">Legacy C89 Output: 49598</text>
      <text x="10" y="34" class="mono" fill="#991b1b">Reason: Hardware 16-bit register overflow</text>
    </g>

    <g transform="translate(400, 85)">
      <rect width="350" height="42" rx="6" fill="#13231e" stroke="#047857"/>
      <text x="10" y="18" class="mono" fill="#6ee7b7">Verified WASM Output: 49598</text>
      <text x="10" y="34" class="mono" fill="#059669">Emulated: acc.wrapping_add(...) bit parity</text>
    </g>
  </g>

  <!-- Status -->
  <circle cx="600" cy="135" r="4" fill="#10b981"/>
  <text x="615" y="139" class="mono" fill="#34d399">10,000 Fuzz Cycles: 0 Divergences</text>
</svg>
